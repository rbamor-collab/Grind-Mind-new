<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRINDMIND - My Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo-container">
            <img src="image/logo.png" alt="GrindMind Logo" class="logo-img">
            <span>GRINDMIND</span>
        </div>
        <div id="navButtons"></div>
    </header>

    <div class="main-container" style="max-width: 800px; padding-top: 30px;">
        
        <!-- Navigation Buttons -->
        <div style="margin-bottom: 25px; display: flex; justify-content: space-between;">
            <a href="dashboard.html" class="btn-logout">&larr; Back to Dashboard</a>
        </div>

        <!-- USER PROFILE CARD -->
        <div class="profile-card" style="text-align: center; padding: 35px; margin-bottom: 30px;">
            
            <!-- Profile Image Container with Camera Button -->
            <div style="position: relative; width: 130px; height: 130px; margin: 0 auto 15px auto;">
                <img id="profileImage" src="image/logo.png" alt="Profile Picture" 
                     style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid #ff75c3; box-shadow: 0 0 15px rgba(255, 117, 195, 0.4);">
                
                <!-- Hidden File Input -->
                <input type="file" id="imageInput" accept="image/*" style="display: none;">
                
                <!-- Camera Icon Trigger -->
                <label for="imageInput" title="Upload Photo" style="position: absolute; bottom: 0; right: 0; background: #ff75c3; color: #2c1a2e; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.4);">
                    📷
                </label>
            </div>

            <h2 id="profileName" style="margin-bottom: 5px; font-size: 1.6rem;">Student Name</h2>
            <p id="profileEmail" style="font-size: 0.95rem; margin-bottom: 20px;">student@email.com</p>

            <!-- Student Metadata -->
            <div style="display: flex; justify-content: center; gap: 20px; font-size: 0.9rem; background: rgba(0, 0, 0, 0.3); padding: 12px; border-radius: 8px;">
                <div><strong>Student ID:</strong> <span id="profileStudentId">GM-2026-0000</span></div>
                <div>|</div>
                <div><strong>Joined:</strong> <span id="profileJoinedDate">October 2026</span></div>
            </div>
        </div>

        <!-- COURSE PROGRESS TRACKING SECTION -->
        <h2 style="color: #ffffff; margin-bottom: 20px; font-size: 1.4rem;">YOUR COURSE PROGRESS</h2>

        <div style="display: flex; flex-direction: column; gap: 20px; margin-bottom: 40px;">
            
            <!-- Word Progress -->
            <div class="course-card" style="padding: 20px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <h3 style="font-size: 1.1rem; margin: 0;">Microsoft Word Course</h3>
                    <span id="wordProgressText" style="font-size: 0.85rem; color: #ff75c3 !important; font-weight: bold;">0 / 3 Modules</span>
                </div>
                <div style="background-color: #2c1a2e; border-radius: 8px; height: 12px; width: 100%; overflow: hidden; border: 1px solid #ff75c3;">
                    <div id="wordProgressBar" style="background-color: #ff75c3; width: 0%; height: 100%; transition: width 0.5s ease;"></div>
                </div>
            </div>

            <!-- Excel Progress -->
            <div class="course-card" style="padding: 20px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <h3 style="font-size: 1.1rem; margin: 0;">Microsoft Excel Course</h3>
                    <span id="excelProgressText" style="font-size: 0.85rem; color: #ff75c3 !important; font-weight: bold;">0 / 3 Modules</span>
                </div>
                <div style="background-color: #2c1a2e; border-radius: 8px; height: 12px; width: 100%; overflow: hidden; border: 1px solid #ff75c3;">
                    <div id="excelProgressBar" style="background-color: #ff75c3; width: 0%; height: 100%; transition: width 0.5s ease;"></div>
                </div>
            </div>

            <!-- PowerPoint Progress -->
            <div class="course-card" style="padding: 20px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <h3 style="font-size: 1.1rem; margin: 0;">Microsoft PowerPoint Course</h3>
                    <span id="pptProgressText" style="font-size: 0.85rem; color: #ff75c3 !important; font-weight: bold;">0 / 3 Modules</span>
                </div>
                <div style="background-color: #2c1a2e; border-radius: 8px; height: 12px; width: 100%; overflow: hidden; border: 1px solid #ff75c3;">
                    <div id="pptProgressBar" style="background-color: #ff75c3; width: 0%; height: 100%; transition: width 0.5s ease;"></div>
                </div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
