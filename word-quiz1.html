<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRINDMIND.COM - Word Module 1 Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo-container">
            <img src="image/logo.png" alt="GrindMind Logo" class="site-logo">
            <span class="logo-text">GrindMind</span>
        </div>
        <div class="nav-buttons">
            <a href="word-course.html" class="btn-logout">&larr; Back to Course</a>
        </div>
    </header>

    <main class="main-container" style="max-width: 700px; margin-top: 20px;">
        <div class="course-card">
            <span class="course-header-tag word-tag">QUIZ 1</span>
            <h2 style="margin: 10px 0 5px 0; color: #2c1a2e;">Module 1 Knowledge Check</h2>
<!-- BAGONG INSTRUCTION TEXT -->
<p style="color: #6b7280; font-size: 0.95rem; font-weight: 600; margin-bottom: 25px;">Choose the correct answer for each question.</p>            
            <form id="quizForm">
                <!-- QUESTION 1 -->
                <div class="form-group" style="margin-bottom: 25px; border-bottom: 1px solid #f3e8ff; padding-bottom: 15px;">
                    <label style="font-size: 1rem; font-weight: bold; margin-bottom: 12px; display: block; color: #2c1a2e;">
                        1. What is the main purpose of Microsoft Word?
                    </label>
                    <div style="display: flex; flex-direction: column; gap: 10px; color: #2c1a2e;">
                        <label style="display: grid; grid-template-columns: 24px 1fr; align-items: center; cursor: pointer;"><input type="radio" name="q1" value="A" required> <span>A. To create and edit documents</span></label>
                        <label style="display: grid; grid-template-columns: 24px 1fr; align-items: center; cursor: pointer;"><input type="radio" name="q1" value="B"> <span>B. To edit videos</span></label>
                        <label style="display: grid; grid-template-columns: 24px 1fr; align-items: center; cursor: pointer;"><input type="radio" name="q1" value="C"> <span>C. To manage databases</span></label>
                        <label style="display: grid; grid-template-columns: 24px 1fr; align-items: center; cursor: pointer;"><input type="radio" name="q1" value="D"> <span>D. To create animations</span></label>
                    </div>
                </div>

                <!-- QUESTION 2 -->
                <div class="form-group" style="margin-bottom: 25px; border-bottom: 1px solid #f3e8ff; padding-bottom: 15px;">
                    <label style="font-size: 1rem; font-weight: bold; margin-bottom: 12px; display: block; color: #2c1a2e;">
                        2. What is the Ribbon in Microsoft Word?
                    </label>
                    <div style="display: flex; flex-direction: column; gap: 10px; color: #2c1a2e;">
                        <label style="display: grid; grid-template-columns: 24px 1fr; align-items: center; cursor: pointer;"><input type="radio" name="q2" value="A" required> <span>A. The area where you type your document</span></label>
                        <label style="display: grid; grid-template-columns: 24px 1fr; align-items: center; cursor: pointer;"><input type="radio" name="q2" value="B"> <span>B. The strip containing tabs and groups of commands</span></label>
                        <label style="display: grid; grid-template-columns: 24px 1fr; align-items: center; cursor: pointer;"><input type="radio" name="q2" value="C"> <span>C. The bar showing the page number</span></label>
                        <label style="display: grid; grid-template-columns: 24px 1fr; align-items: center; cursor: pointer;"><input type="radio" name="q2" value="D"> <span>D. The area displaying the file name only</span></label>
                    </div>
                </div>

                <!-- QUESTION 3 -->
                <div class="form-group" style="margin-bottom: 25px; border-bottom: 1px solid #f3e8ff; padding-bottom: 15px;">
                    <label style="font-size: 1rem; font-weight: bold; margin-bottom: 12px; display: block; color: #2c1a2e;">
                        3. Which tab contains the Bold, Italic, and Font Size commands?
                    </label>
                    <div style="display: flex; flex-direction: column; gap: 10px; color: #2c1a2e;">
                        <label style="display: grid; grid-template-columns: 24px 1fr; align-items: center; cursor: pointer;"><input type="radio" name="q3" value="A" required> <span>A. Insert</span></label>
                        <label style="display: grid; grid-template-columns: 24px 1fr; align-items: center; cursor: pointer;"><input type="radio" name="q3" value="B"> <span>B. Review</span></label>
                        <label style="display: grid; grid-template-columns: 24px 1fr; align-items: center; cursor: pointer;"><input type="radio" name="q3" value="C"> <span>C. Home</span></label>
                        <label style="display: grid; grid-template-columns: 24px 1fr; align-items: center; cursor: pointer;"><input type="radio" name="q3" value="D"> <span>D. View</span></label>
                    </div>
                </div>

                <!-- QUESTION 4 -->
                <div class="form-group" style="margin-bottom: 25px; border-bottom: 1px solid #f3e8ff; padding-bottom: 15px;">
                    <label style="font-size: 1rem; font-weight: bold; margin-bottom: 12px; display: block; color: #2c1a2e;">
                        4. What is the function of the Title Bar?
                    </label>
                    <div style="display: flex; flex-direction: column; gap: 10px; color: #2c1a2e;">
                        <label style="display: grid; grid-template-columns: 24px 1fr; align-items: center; cursor: pointer;"><input type="radio" name="q4" value="A" required> <span>A. To change paragraph spacing</span></label>
                        <label style="display: grid; grid-template-columns: 24px 1fr; align-items: center; cursor: pointer;"><input type="radio" name="q4" value="B"> <span>B. To display the document name</span></label>
                        <label style="display: grid; grid-template-columns: 24px 1fr; align-items: center; cursor: pointer;"><input type="radio" name="q4" value="C"> <span>C. To insert a table</span></label>
                        <label style="display: grid; grid-template-columns: 24px 1fr; align-items: center; cursor: pointer;"><input type="radio" name="q4" value="D"> <span>D. To check spelling and grammar</span></label>
                    </div>
                </div>

                <!-- QUESTION 5 -->
                <div class="form-group" style="margin-bottom: 25px; border-bottom: 1px solid #f3e8ff; padding-bottom: 15px;">
                    <label style="font-size: 1rem; font-weight: bold; margin-bottom: 12px; display: block; color: #2c1a2e;">
                        5. What is the purpose of the Quick Access Toolbar?
                    </label>
                    <div style="display: flex; flex-direction: column; gap: 10px; color: #2c1a2e;">
                        <label style="display: grid; grid-template-columns: 24px 1fr; align-items: center; cursor: pointer;"><input type="radio" name="q5" value="A" required> <span>A. To display all document pages</span></label>
                        <label style="display: grid; grid-template-columns: 24px 1fr; align-items: center; cursor: pointer;"><input type="radio" name="q5" value="B"> <span>B. To provide quick access to frequently used commands</span></label>
                        <label style="display: grid; grid-template-columns: 24px 1fr; align-items: center; cursor: pointer;"><input type="radio" name="q5" value="C"> <span>C. To change the page color only</span></label>
                        <label style="display: grid; grid-template-columns: 24px 1fr; align-items: center; cursor: pointer;"><input type="radio" name="q5" value="D"> <span>D. To display the word count only</span></label>
                    </div>
                </div>

                <!-- QUESTION 6 -->
                <div class="form-group" style="margin-bottom: 25px; border-bottom: 1px solid #f3e8ff; padding-bottom: 15px;">
                    <label style="font-size: 1rem; font-weight: bold; margin-bottom: 12px; display: block; color: #2c1a2e;">
                        6. Which command makes text appear thicker or darker?
                    </label>
                    <div style="display: flex; flex-direction: column; gap: 10px; color: #2c1a2e;">
                        <label style="display: grid; grid-template-columns: 24px 1fr; align-items: center; cursor: pointer;"><input type="radio" name="q6" value="A" required> <span>A. Italic</span></label>
                        <label style="display: grid; grid-template-columns: 24px 1fr; align-items: center; cursor: pointer;"><input type="radio" name="q6" value="B"> <span>B. Underline</span></label>
                        <label style="display: grid; grid-template-columns: 24px 1fr; align-items: center; cursor: pointer;"><input type="radio" name="q6" value="C"> <span>C. Bold</span></label>
                        <label style="display: grid; grid-template-columns: 24px 1fr; align-items: center; cursor: pointer;"><input type="radio" name="q6" value="D"> <span>D. Justify</span></label>
                    </div>
                </div>

                <!-- QUESTION 7 -->
                <div class="form-group" style="margin-bottom: 25px; border-bottom: 1px solid #f3e8ff; padding-bottom: 15px;">
                    <label style="font-size: 1rem; font-weight: bold; margin-bottom: 12px; display: block; color: #2c1a2e;">
                        7. Which command makes text appear slanted?
                    </label>
                    <div style="display: flex; flex-direction: column; gap: 10px; color: #2c1a2e;">
                        <label style="display: grid; grid-template-columns: 24px 1fr; align-items: center; cursor: pointer;"><input type="radio" name="q7" value="A" required> <span>A. Bold</span></label>
                        <label style="display: grid; grid-template-columns: 24px 1fr; align-items: center; cursor: pointer;"><input type="radio" name="q7" value="B"> <span>B. Italic</span></label>
                        <label style="display: grid; grid-template-columns: 24px 1fr; align-items: center; cursor: pointer;"><input type="radio" name="q7" value="C"> <span>C. Underline</span></label>
                        <label style="display: grid; grid-template-columns: 24px 1fr; align-items: center; cursor: pointer;"><input type="radio" name="q7" value="D"> <span>D. Center</span></label>
                    </div>
                </div>

                <!-- QUESTION 8 -->
                <div class="form-group" style="margin-bottom: 25px; border-bottom: 1px solid #f3e8ff; padding-bottom: 15px;">
                    <label style="font-size: 1rem; font-weight: bold; margin-bottom: 12px; display: block; color: #2c1a2e;">
                        8. Which alignment makes text even along both the left and right margins?
                    </label>
                    <div style="display: flex; flex-direction: column; gap: 10px; color: #2c1a2e;">
                        <label style="display: grid; grid-template-columns: 24px 1fr; align-items: center; cursor: pointer;"><input type="radio" name="q8" value="A" required> <span>A. Left</span></label>
                        <label style="display: grid; grid-template-columns: 24px 1fr; align-items: center; cursor: pointer;"><input type="radio" name="q8" value="B"> <span>B. Center</span></label>
                        <label style="display: grid; grid-template-columns: 24px 1fr; align-items: center; cursor: pointer;"><input type="radio" name="q8" value="C"> <span>C. Right</span></label>
                        <label style="display: grid; grid-template-columns: 24px 1fr; align-items: center; cursor: pointer;"><input type="radio" name="q8" value="D"> <span>D. Justify</span></label>
                    </div>
                </div>

                <!-- QUESTION 9 -->
                <div class="form-group" style="margin-bottom: 25px; border-bottom: 1px solid #f3e8ff; padding-bottom: 15px;">
                    <label style="font-size: 1rem; font-weight: bold; margin-bottom: 12px; display: block; color: #2c1a2e;">
                        9. What does line spacing control in Microsoft Word?
                    </label>
                    <div style="display: flex; flex-direction: column; gap: 10px; color: #2c1a2e;">
                        <label style="display: grid; grid-template-columns: 24px 1fr; align-items: center; cursor: pointer;"><input type="radio" name="q9" value="A" required> <span>A. The vertical space between lines of text</span></label>
                        <label style="display: grid; grid-template-columns: 24px 1fr; align-items: center; cursor: pointer;"><input type="radio" name="q9" value="B"> <span>B. The size of the font</span></label>
                        <label style="display: grid; grid-template-columns: 24px 1fr; align-items: center; cursor: pointer;"><input type="radio" name="q9" value="C"> <span>C. The color of the text</span></label>
                        <label style="display: grid; grid-template-columns: 24px 1fr; align-items: center; cursor: pointer;"><input type="radio" name="q9" value="D"> <span>D. The document's file name</span></label>
                    </div>
                </div>

                <!-- QUESTION 10 -->
                <div class="form-group" style="margin-bottom: 25px;">
                    <label style="font-size: 1rem; font-weight: bold; margin-bottom: 12px; display: block; color: #2c1a2e;">
                        10. Which alignment places text in the middle between the left and right margins?
                    </label>
                    <div style="display: flex; flex-direction: column; gap: 10px; color: #2c1a2e;">
                        <label style="display: grid; grid-template-columns: 24px 1fr; align-items: center; cursor: pointer;"><input type="radio" name="q10" value="A" required> <span>A. Left</span></label>
                        <label style="display: grid; grid-template-columns: 24px 1fr; align-items: center; cursor: pointer;"><input type="radio" name="q10" value="B"> <span>B. Center</span></label>
                        <label style="display: grid; grid-template-columns: 24px 1fr; align-items: center; cursor: pointer;"><input type="radio" name="q10" value="C"> <span>C. Right</span></label>
                        <label style="display: grid; grid-template-columns: 24px 1fr; align-items: center; cursor: pointer;"><input type="radio" name="q10" value="D"> <span>D. Justify</span></label>
                    </div>
                </div>

                <button type="submit" class="btn-submit">SUBMIT QUIZ</button>
            </form>
        </div>
    </main>

    <script>
        document.getElementById('quizForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const answers = {
                q1: 'A', q2: 'B', q3: 'C', q4: 'B', q5: 'B',
                q6: 'C', q7: 'B', q8: 'D', q9: 'A', q10: 'B'
            };

            let score = 0;
            for (let i = 1; i <= 10; i++) {
                const selected = document.querySelector(`input[name="q${i}"]:checked`)?.value;
                if (selected === answers[`q${i}`]) {
                    score++;
                }
            }

            let status = score >= 7 ? "PASSED! 🎉" : "NEEDS IMPROVEMENT 📚";
            alert(`Quiz Submitted!\n\nScore: ${score} / 10\nStatus: ${status}`);

            window.location.href = 'word-course.html';
        });
    </script>
</body>
</html>
