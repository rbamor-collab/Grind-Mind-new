<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRINDMIND.COM - PowerPoint Module 1 Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo-container">
            <img src="image/logo.png" alt="GrindMind Logo" class="site-logo">
            <span class="logo-text">GrindMind</span>
        </div>
        <div class="nav-buttons">
            <a href="powerpoint-course.html" class="btn-logout">&larr; Back to Course</a>
        </div>
    </header>

    <main class="main-container" style="max-width: 700px; margin-top: 20px;">
        <div class="course-card">
            <span class="course-header-tag ppt-tag">QUIZ 1</span>
            <h2 style="margin: 10px 0 5px 0; color: #2c1a2e;">Module 1 Knowledge Check</h2>
            <p style="color: #6b7280; font-size: 0.9rem; margin-bottom: 25px;">Sagutan ang 10 tanong sa ibaba para masubukan ang iyong natutunan sa Module 1 ng Microsoft PowerPoint.</p>
            
            <form id="quizForm">
                <!-- QUESTION 1 -->
                <div class="form-group" style="margin-bottom: 25px; border-bottom: 1px solid #f3e8ff; padding-bottom: 15px;">
                    <label style="font-size: 1rem; font-weight: bold; margin-bottom: 12px; display: block; color: #2c1a2e;">
                        1. What is the main purpose of Microsoft PowerPoint?
                    </label>
                    <div style="display: flex; flex-direction: column; gap: 8px; color: #2c1a2e;">
                        <label><input type="radio" name="q1" value="A" required> A. To create slide presentations</label>
                        <label><input type="radio" name="q1" value="B"> B. To calculate spreadsheet formulas</label>
                        <label><input type="radio" name="q1" value="C"> C. To manage email messages</label>
                        <label><input type="radio" name="q1" value="D"> D. To write long documents</label>
                    </div>
                </div>

                <!-- QUESTION 2 -->
                <div class="form-group" style="margin-bottom: 25px; border-bottom: 1px solid #f3e8ff; padding-bottom: 15px;">
                    <label style="font-size: 1rem; font-weight: bold; margin-bottom: 12px; display: block; color: #2c1a2e;">
                        2. What is a slide layout in PowerPoint?
                    </label>
                    <div style="display: flex; flex-direction: column; gap: 8px; color: #2c1a2e;">
                        <label><input type="radio" name="q2" value="A" required> A. A transition between slides</label>
                        <label><input type="radio" name="q2" value="B"> B. An arrangement of placeholders on a slide</label>
                        <label><input type="radio" name="q2" value="C"> C. A saved copy of a presentation</label>
                        <label><input type="radio" name="q2" value="D"> D. An animation applied to text</label>
                    </div>
                </div>

                <!-- QUESTION 3 -->
                <div class="form-group" style="margin-bottom: 25px; border-bottom: 1px solid #f3e8ff; padding-bottom: 15px;">
                    <label style="font-size: 1rem; font-weight: bold; margin-bottom: 12px; display: block; color: #2c1a2e;">
                        3. Which PowerPoint view is best for presenting slides to an audience?
                    </label>
                    <div style="display: flex; flex-direction: column; gap: 8px; color: #2c1a2e;">
                        <label><input type="radio" name="q3" value="A" required> A. Normal View</label>
                        <label><input type="radio" name="q3" value="B"> B. Slide Sorter View</label>
                        <label><input type="radio" name="q3" value="C"> C. Slide Show View</label>
                        <label><input type="radio" name="q3" value="D"> D. Notes Page View</label>
                    </div>
                </div>

                <!-- QUESTION 4 -->
                <div class="form-group" style="margin-bottom: 25px; border-bottom: 1px solid #f3e8ff; padding-bottom: 15px;">
                    <label style="font-size: 1rem; font-weight: bold; margin-bottom: 12px; display: block; color: #2c1a2e;">
                        4. Which view displays slide thumbnails so you can easily rearrange the order of slides?
                    </label>
                    <div style="display: flex; flex-direction: column; gap: 8px; color: #2c1a2e;">
                        <label><input type="radio" name="q4" value="A" required> A. Reading View</label>
                        <label><input type="radio" name="q4" value="B"> B. Slide Show View</label>
                        <label><input type="radio" name="q4" value="C"> C. Notes Page View</label>
                        <label><input type="radio" name="q4" value="D"> D. Slide Sorter View</label>
                    </div>
                </div>

                <!-- QUESTION 5 -->
                <div class="form-group" style="margin-bottom: 25px; border-bottom: 1px solid #f3e8ff; padding-bottom: 15px;">
                    <label style="font-size: 1rem; font-weight: bold; margin-bottom: 12px; display: block; color: #2c1a2e;">
                        5. Which command adds a new slide to a presentation?
                    </label>
                    <div style="display: flex; flex-direction: column; gap: 8px; color: #2c1a2e;">
                        <label><input type="radio" name="q5" value="A" required> A. New Slide</label>
                        <label><input type="radio" name="q5" value="B"> B. New Window</label>
                        <label><input type="radio" name="q5" value="C"> C. New Comment</label>
                        <label><input type="radio" name="q5" value="D"> D. New Animation</label>
                    </div>
                </div>

                <!-- QUESTION 6 -->
                <div class="form-group" style="margin-bottom: 25px; border-bottom: 1px solid #f3e8ff; padding-bottom: 15px;">
                    <label style="font-size: 1rem; font-weight: bold; margin-bottom: 12px; display: block; color: #2c1a2e;">
                        6. Which command lets you place words or sentences on a slide in a text box?
                    </label>
                    <div style="display: flex; flex-direction: column; gap: 8px; color: #2c1a2e;">
                        <label><input type="radio" name="q6" value="A" required> A. Insert Chart</label>
                        <label><input type="radio" name="q6" value="B"> B. Text Box</label>
                        <label><input type="radio" name="q6" value="C"> C. Insert Audio</label>
                        <label><input type="radio" name="q6" value="D"> D. Slide Transition</label>
                    </div>
                </div>

                <!-- QUESTION 7 -->
                <div class="form-group" style="margin-bottom: 25px; border-bottom: 1px solid #f3e8ff; padding-bottom: 15px;">
                    <label style="font-size: 1rem; font-weight: bold; margin-bottom: 12px; display: block; color: #2c1a2e;">
                        7. Which PowerPoint feature allows you to add a picture from your device to a slide?
                    </label>
                    <div style="display: flex; flex-direction: column; gap: 8px; color: #2c1a2e;">
                        <label><input type="radio" name="q7" value="A" required> A. Slide Number</label>
                        <label><input type="radio" name="q7" value="B"> B. Font Color</label>
                        <label><input type="radio" name="q7" value="C"> C. Insert Pictures</label>
                        <label><input type="radio" name="q7" value="D"> D. Paragraph Spacing</label>
                    </div>
                </div>

                <!-- QUESTION 8 -->
                <div class="form-group" style="margin-bottom: 25px; border-bottom: 1px solid #f3e8ff; padding-bottom: 15px;">
                    <label style="font-size: 1rem; font-weight: bold; margin-bottom: 12px; display: block; color: #2c1a2e;">
                        8. What is the purpose of shapes in PowerPoint?
                    </label>
                    <div style="display: flex; flex-direction: column; gap: 8px; color: #2c1a2e;">
                        <label><input type="radio" name="q8" value="A" required> A. To check spelling automatically</label>
                        <label><input type="radio" name="q8" value="B"> B. To change the order of slides</label>
                        <label><input type="radio" name="q8" value="C"> C. To save a presentation as a file</label>
                        <label><input type="radio" name="q8" value="D"> D. To add visual elements such as arrows and rectangles</label>
                    </div>
                </div>

                <!-- QUESTION 9 -->
                <div class="form-group" style="margin-bottom: 25px; border-bottom: 1px solid #f3e8ff; padding-bottom: 15px;">
                    <label style="font-size: 1rem; font-weight: bold; margin-bottom: 12px; display: block; color: #2c1a2e;">
                        9. True or False: In PowerPoint, you can change the layout of a slide after creating it.
                    </label>
                    <div style="display: flex; flex-direction: column; gap: 8px; color: #2c1a2e;">
                        <label><input type="radio" name="q9" value="A" required> A. True</label>
                        <label><input type="radio" name="q9" value="B"> B. False</label>
                    </div>
                </div>

                <!-- QUESTION 10 -->
                <div class="form-group" style="margin-bottom: 25px;">
                    <label style="font-size: 1rem; font-weight: bold; margin-bottom: 12px; display: block; color: #2c1a2e;">
                        10. True or False: Cropping a picture in PowerPoint is used to change the font size of the text on a slide.
                    </label>
                    <div style="display: flex; flex-direction: column; gap: 8px; color: #2c1a2e;">
                        <label><input type="radio" name="q10" value="A" required> A. True</label>
                        <label><input type="radio" name="q10" value="B"> B. False</label>
                    </div>
                </div>

                <button type="submit" class="btn-submit">SUBMIT QUIZ</button>
            </form>
        </div>
    </main>

    <script>
        document.getElementById('quizForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // Answer Key: 1:A, 2:B, 3:C, 4:D, 5:A, 6:B, 7:C, 8:D, 9:A, 10:B
            const answers = {
                q1: 'A', q2: 'B', q3: 'C', q4: 'D', q5: 'A',
                q6: 'B', q7: 'C', q8: 'D', q9: 'A', q10: 'B'
            };

            let score = 0;
            for (let i = 1; i <= 10; i++) {
                const selected = document.querySelector(`input[name="q${i}"]:checked`)?.value;
                if (selected === answers[`q${i}`]) {
                    score++;
                }
            }

            let status = score >= 7 ? "PASSED! 🎉" : "NEEDS IMPROVEMENT 📚";
            alert(`Quiz Submitted!\n\nScore: ${score} / 10\nStatus: ${status}`);

            window.location.href = 'powerpoint-course.html';
        });
    </script>
</body>
</html>
