<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GrindMind - Log In</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Secure Modal Styles */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-box {
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      text-align: center;
    }
    .modal-box input {
      width: 100%;
      padding: 10px;
      margin: 10px 0 15px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
    }
    .modal-buttons {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }
    .modal-buttons button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-confirm { background: #3b233a; color: white; }
    .btn-cancel { background: #ccc; color: #333; }
  </style>
</head>
<body>

  <!-- Navigation / Header -->
  <header class="navbar">
    <div class="logo-container">
      <img src="image/logo.png" alt="GrindMind Logo" class="logo-img">
      <span>GRINDMIND.COM</span>
    </div>
    <a href="index.html" class="btn-logout">&larr; Back to Home</a>
  </header>

  <!-- Form Container -->
  <main class="login-container">
    <div class="login-box" style="padding-top: 40px;">
      <h2 style="margin-bottom: 20px; color: #3b233a;">Welcome Back</h2>

      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" placeholder="Enter your email address" required>
        </div>

        <div class="form-group" style="position: relative;">
          <label for="loginPassword">Password</label>
          <div style="position: relative; display: flex; align-items: center;">
            <input type="password" id="loginPassword" placeholder="Enter your password" required style="width: 100%; padding-right: 40px;">
            <button type="button" id="toggleLoginPassword" style="position: absolute; right: 10px; background: none; border: none; cursor: pointer; font-size: 1.1rem; color: #6b7280;">👁️</button>
          </div>
        </div>

        <button type="submit" class="btn-submit">Log In</button>

        <p class="terms-text" style="margin-top: 15px;">
          <a href="#" id="openModalBtn" style="font-weight: bold; color: #ff477e;">Forgot Password?</a>
        </p>

        <p class="terms-text" style="margin-top: 15px;">
          Don't have an account yet? <a href="signup.html" style="font-weight: bold;">Sign Up</a>
        </p>
      </form>
    </div>
  </main>

  <!-- SECURE PASSWORD RESET MODAL -->
  <div id="forgotModal" class="modal-overlay">
    <div class="modal-box">
      <h3 style="color: #3b233a; margin-bottom: 10px;">Reset Password</h3>
      <p id="modalInstruction" style="font-size: 0.9rem; color: #555; margin-bottom: 15px;">Enter your registered email address:</p>
      
      <input type="email" id="modalInput" placeholder="Enter your email...">
      
      <div class="modal-buttons">
        <button type="button" id="modalCancelBtn" class="btn-cancel">Cancel</button>
        <button type="button" id="modalSubmitBtn" class="btn-confirm">Next</button>
      </div>
    </div>
  </div>

  <!-- SCRIPT PARA SA SECURE FLOW -->
  <script>
    const openModalBtn = document.getElementById('openModalBtn');
    const forgotModal = document.getElementById('forgotModal');
    const modalInstruction = document.getElementById('modalInstruction');
    const modalInput = document.getElementById('modalInput');
    const modalSubmitBtn = document.getElementById('modalSubmitBtn');
    const modalCancelBtn = document.getElementById('modalCancelBtn');

    let resetStep = 1; // Step 1: Verify Email, Step 2: Set New Password
    let targetUserEmail = "";

    if (openModalBtn) {
        openModalBtn.addEventListener('click', function(e) {
            e.preventDefault();
            resetStep = 1;
            targetUserEmail = "";
            modalInstruction.textContent = "Enter your registered email address:";
            modalInput.value = "";
            modalInput.type = "email";
            modalInput.placeholder = "Enter your email...";
            modalSubmitBtn.textContent = "Next";
            forgotModal.style.display = 'flex';
        });
    }

    modalCancelBtn.addEventListener('click', function() {
        forgotModal.style.display = 'none';
    });

    modalSubmitBtn.addEventListener('click', function() {
        let inputValue = modalInput.value.trim();
        if (!inputValue) {
            alert("Please fill out this field.");
            return;
        }

        let usersList = JSON.parse(localStorage.getItem('users')) || [];

        if (resetStep === 1) {
            // STEP 1: I-verify kung existing ang email
            let foundUser = usersList.find(u => u.email.toLowerCase() === inputValue.toLowerCase());

            if (foundUser) {
                targetUserEmail = foundUser.email;
                resetStep = 2;
                modalInstruction.innerHTML = `Account verified!<br><br>Enter your <b>NEW password</b> below (for security, your old password is hidden):`;
                modalInput.value = "";
                modalInput.type = "password";
                modalInput.placeholder = "Enter new password...";
                modalSubmitBtn.textContent = "Update Password";
            } else {
                alert("No account found with this email address.");
            }
        } 
        else if (resetStep === 2) {
            // STEP 2: I-save agad ang bagong password nang hindi na ipinapakita ang lumang password
            let userIndex = usersList.findIndex(u => u.email.toLowerCase() === targetUserEmail.toLowerCase());
            
            if (userIndex !== -1) {
                usersList[userIndex].password = inputValue;
                localStorage.setItem('users', JSON.stringify(usersList));

                // Update din ang currentUser kung active session
                let currentUser = JSON.parse(localStorage.getItem('currentUser'));
                if (currentUser && currentUser.email.toLowerCase() === targetUserEmail.toLowerCase()) {
                    currentUser.password = inputValue;
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                }

                alert("Password successfully updated! You can now log in with your new password.");
                forgotModal.style.display = 'none';
            } else {
                alert("An error occurred. Please try again.");
                forgotModal.style.display = 'none';
            }
        }
    });
  </script>

  <script>
  // Kapag nag-submit sa Login Form
  document.querySelector("form").addEventListener("submit", function(e) {
      e.preventDefault(); // Iwas page refresh muna
      
      // Kunin ang value ng input box (halimbawa email o name)
      const inputVal = document.querySelector('input[type="email"], input[type="text"]').value;
      
      // Kung email, kunin lang ang pangalan bago ang @ (halimbawa: "Angeline" mula sa "angeline@gmail.com")
      let username = inputVal.split('@')[0];
      
      // I-capitalize ang unang letra ng pangalan
      username = username.charAt(0).toUpperCase() + username.slice(1);
      
      // I-save sa memory ng browser
      localStorage.setItem("loggedInUser", username);
      
      // Pumunta na sa dashboard
      window.location.href = "dashboard.html";
  });
</script>

  <script src="script.js"></script>
</body>
</html>
